<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vincenzo Di Donato | Fotografia e Video</title>

  <meta
    name="description"
    content="Portfolio di Vincenzo Di Donato, fotografo, videomaker e grafico in Abruzzo. Scopri lavori, servizi e progetti creativi."
  >

  <meta name="theme-color" content="#faf9f6">

  <style>
    /* =========================
       COLORI
       ========================= */

    :root {
      --background: #faf9f6;
      --surface: #ffffff;
      --text: #202020;
      --muted: #626262;
      --accent: #202020;
      --border: #e3e1dc;
      --placeholder: #eeede9;
    }

    /* =========================
       IMPOSTAZIONI GENERALI
       ========================= */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 120px;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 6px;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .container {
      width: min(1100px, 90%);
      margin-inline: auto;
    }

    .skip-link {
      position: absolute;
      top: -150px;
      left: 20px;
      z-index: 100;
      padding: 12px 18px;
      background: var(--accent);
      color: var(--surface);
    }

    .skip-link:focus {
      top: 10px;
    }

    /* =========================
       BARRA SUPERIORE CHIARA
       ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--background);
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding-block: 22px;
    }

    .logo {
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.07em;
    }

    .navigation-links {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }

    .navigation-links a {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .navigation-links a:hover,
    .navigation-links a:focus-visible {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }

    /* =========================
       TITOLI E TESTI
       ========================= */

    .eyebrow {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 30px;
      font-weight: 600;
      letter-spacing: -0.05em;
    }

    h2 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.02em;
    }

    .section-description {
      max-width: 620px;
      margin: 0 0 42px;
      color: var(--muted);
    }

    /* =========================
       HERO FOTOGRAFICA
       ========================= */

    .hero {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding-block: 90px;
      overflow: hidden;
      background: #202020;
      color: #ffffff;
    }

    .hero-background {
      position: absolute;
      inset: 0;
      z-index: -2;
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      object-fit: cover;
      object-position: center;
    }

    /* Velo scuro sopra la foto, sotto al testo */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.72) 0%,
        rgba(0, 0, 0, 0.48) 55%,
        rgba(0, 0, 0, 0.22) 100%
      );
    }

    .hero-content {
      position: relative;
    }

    .hero h1 {
      max-width: 850px;
      color: #ffffff;
      font-size: clamp(3rem, 6.5vw, 5.8rem);
      line-height: 1.08;
    }

    .hero .eyebrow {
      color: #ffffff;
    }

    .hero-description {
      max-width: 580px;
      margin: 0;
      color: #ffffff;
      font-size: 1.05rem;
      line-height: 1.85;
    }

    /* =========================
       PULSANTI
       ========================= */

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 36px;
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      padding: 12px 24px;
      border: 1px solid var(--accent);
      border-radius: 2px;
      background: var(--accent);
      color: var(--surface);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      transition:
        background-color 0.2s ease,
        border-color 0.2s ease;
    }

    .button:hover {
      background: #3b3b3b;
      border-color: #3b3b3b;
    }

    .button-secondary {
      border-color: var(--border);
      background: transparent;
      color: var(--text);
    }

    .button-secondary:hover {
      border-color: var(--text);
      background: transparent;
    }

    /* Pulsanti sopra la fotografia */
    .hero .button {
      border-color: #ffffff;
      background: #ffffff;
      color: #202020;
    }

    .hero .button:hover {
      border-color: #eaeaea;
      background: #eaeaea;
    }

    .hero .button-secondary {
      border-color: #ffffff;
      background: transparent;
      color: #ffffff;
    }

    .hero .button-secondary:hover {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
    }

    /* =========================
       SEZIONI
       ========================= */

    section:not(.hero) {
      padding-block: 95px;
      border-top: 1px solid var(--border);
    }

    /* =========================
       PORTFOLIO
       ========================= */

    .projects {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .project {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
    }

    .project-cover
